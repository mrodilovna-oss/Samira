const apply=()=>{cv.style.transform=`scale(${z})`;sz.style.width=cw*z+"px";sz.style.height=ch*z+"px"};
const setZ=(nz,fx=vp.clientWidth/2,fy=vp.clientHeight/2)=>{nz=Math.min(2.5,Math.max(.25,nz));const a=(vp.scrollLeft+fx)/z,b=(vp.scrollTop+fy)/z;z=nz;apply();vp.scrollLeft=a*z-fx;vp.scrollTop=b*z-fy};
const go=x=>vp.scrollTo({left:x*z-vp.clientWidth/2,behavior:"smooth"});
function render(s){
side=s;all=[];cx=100;
SIDES[s].forEach(r=>lay(r,r.dep||0));
mind=Math.min(...all.map(n=>n.dep));const md=Math.max(...all.map(n=>n.dep));
cw=cx+60;ch=TOP+(md-mind)*HS+CH+60;
cv.style.width=cw+"px";cv.style.height=ch+"px";
cv.innerHTML='<svg id="sv"></svg>';sv=cv.firstChild;sv.setAttribute("width",cw);sv.setAttribute("height",ch);
let p="";
const edge=(a,b)=>{const y1=by(a)+CH-6,y2=by(b)+4,m=(y1+y2)/2;p+=`<path class="e" d="M${a.x},${y1} C${a.x},${m} ${b.x},${m} ${b.x},${y2}"/>`};
all.forEach(n=>{n.k.forEach(c=>edge(n,c));(n.sec||[]).forEach(c=>edge(n,c))});
sv.innerHTML=p;
all.forEach(n=>{const e=document.createElement("div");e.className="n"+(dead(n)?" x":"")+(n.me?" me":"");e.style.cssText=`left:${n.x}px;top:${by(n)}px`;
e.dataset.q=(n.t+n.s+n.d).toLowerCase();e.innerHTML=`<div class="i">${n.me?"🌟":dead(n)?"🕊️":"🌿"}</div><b>${n.t}</b><em>${n.s}</em><small>${n.d}</small>`;cv.appendChild(e);n.el=e});
const t=document.createElement("div");t.className="tag";t.textContent=s=="ota"?"Ota tomon":"Ona tomon";t.style.cssText=`left:${SIDES[s][0].x}px;top:14px`;cv.appendChild(t);
bo.classList.toggle("on",s=="ota");bn.classList.toggle("on",s=="ona");
apply();
}
const show=(s,x)=>{if(side!=s)render(s);vp.scrollTo({left:x*z-vp.clientWidth/2,top:0})};
const walk=(n,f)=>{f(n);n.k.forEach(c=>walk(c,f))};
const has=(s,v)=>{let r=null;SIDES[s].forEach(root=>walk(root,n=>{if(!r&&(n.t+n.s+n.d).toLowerCase().includes(v))r=n}));return r};
bm.onclick=()=>{if(side!="ona")render("ona");go(all.find(n=>n.me).x)};
bo.onclick=()=>{render("ota");vp.scrollTo({left:OTA.x*z-vp.clientWidth/2,top:0})};
bn.onclick=()=>{render("ona");vp.scrollTo({left:ONA.x*z-vp.clientWidth/2,top:0})};
zi.onclick=()=>setZ(z*1.25);zo.onclick=()=>setZ(z/1.25);
q.oninput=()=>{const v=q.value.trim().toLowerCase();
if(v&&!all.some(n=>n.el.dataset.q.includes(v))){const o=side=="ota"?"ona":"ota";if(has(o,v))render(o)}
all.forEach(n=>{const h=v&&n.el.dataset.q.includes(v);n.el.classList.toggle("hit",!!h);n.el.classList.toggle("dim",!!v&&!h)});
const f=all.find(n=>v&&n.el.dataset.q.includes(v));if(f)go(f.x)};
let dn=0,sx,sy,l0,t0;vp.onpointerdown=e=>{if(e.pointerType=="mouse"){dn=1;sx=e.clientX;sy=e.clientY;l0=vp.scrollLeft;t0=vp.scrollTop}};
addEventListener("pointerup",()=>dn=0);addEventListener("pointermove",e=>{if(dn){vp.scrollLeft=l0-(e.clientX-sx);vp.scrollTop=t0-(e.clientY-sy)}});
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
let pd=0,pz=1;
vp.addEventListener("touchstart",e=>{if(e.touches.length==2){pd=dist(e);pz=z}},{passive:true});
vp.addEventListener("touchmove",e=>{if(e.touches.length==2){e.preventDefault();const r=vp.getBoundingClientRect(),[a,b]=e.touches;setZ(pz*dist(e)/pd,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top)}},{passive:false});
addEventListener("gesturestart",e=>e.preventDefault());
vp.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const r=vp.getBoundingClientRect();setZ(z*Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
render("ona");setTimeout(()=>vp.scrollTo({left:all.find(n=>n.me).x*z-vp.clientWidth/2}),50);
const c=document.getElementById("ff"),g=c.getContext("2d");let w,h;const F=[];
const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener("resize",rs);
for(let i=0;i<34;i++)F.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.2,a:Math.random()*6,s:.2+Math.random()*.4});
(function f(){g.clearRect(0,0,w,h);F.forEach(o=>{o.a+=.02;o.x+=Math.cos(o.a)*o.s;o.y+=Math.sin(o.a*.7)*o.s-.1;if(o.y<-10)o.y=h+10;const al=.35+.5*Math.sin(o.a*2);g.fillStyle=`rgba(240,235,150,${al})`;g.shadowColor="#f0e68c";g.shadowBlur=12;g.beginPath();g.arc(o.x,o.y,o.r,0,7);g.fill()});requestAnimationFrame(f)})();
</script></body></html>
